<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>网站响应式预览</title><style>*{box-sizing:border-box}body{margin:0;background:#20272c;color:#edf1ef;font:14px system-ui}header{padding:14px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:8px 12px;background:#101316;color:#a2e2bb;border:1px solid #506069;font:inherit;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#a2e2bb;color:#101316}.frame{padding:16px 24px 24px;width:max-content;min-width:100%}iframe{border:1px solid #506069;display:block;margin:auto;background:#101316}</style></head><body><header><strong>响应式预览</strong><button data-width="1487" data-height="1058">桌面 1487</button><button data-width="1024" data-height="768">平板 1024</button><button data-width="390" data-height="844">手机 390</button><button data-width="320" data-height="780">窄屏 320</button><span id="size" aria-live="polite"></span></header><div class="frame"><iframe title="网站预览" src="/index.html?v=913233bfabd7" width="1487" height="1058"></iframe></div><script>const f=document.querySelector('iframe'); const buttons=[...document.querySelectorAll('button')]; function choose(b){f.width=b.dataset.width;f.height=b.dataset.height;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#size').textContent=f.width+' × '+f.height}buttons.forEach(b=>b.addEventListener('click',()=>choose(b)));choose(buttons.find(b=>b.dataset.width===new URLSearchParams(location.search).get('width'))||buttons[0]);</script></body></html>
